collection:
  - url: "{{ _.base_url
      }}/_zentity/resolution/zentity_tutorial_5_person?pretty&_source=false"
    name: 8. Resolution with scoped resolvers
    meta:
      id: req_2445cc7e86cf4abfb513dba099763e86
      created: 1750374701067
      modified: 1750396674730
      isPrivate: false
      description: ""
      sortKey: -1750374701067
    method: POST
    body:
      mimeType: application/json
      text: |-
        {
          "attributes": {
            "first_name": [ "Allie" ],
            "last_name": [ "Jones" ],
            "phone": [ "202-555-1234" ]
          },
          "scope": {
            "include": {
              "indices": [
                "zentity_tutorial_5_cross_index_resolution_a",
                "zentity_tutorial_5_cross_index_resolution_b"
              ]
            },
            "exclude": {
              "resolvers": [
                "name_street_city_state"
              ]
            }
          }
        }
    headers:
      - name: Content-Type
        value: application/json
      - name: User-Agent
        value: insomnia/11.2.0
    scripts:
      afterResponse: >-
        const expectedResponse = {
          "took" : 42,
          "hits" : {
            "total" : 6,
            "hits" : [ {
              "_index" : "zentity_tutorial_5_cross_index_resolution_a",
              "_id" : "1",
              "_hop" : 0,
              "_query" : 0,
              "_attributes" : {
                "city" : [ "Washington" ],
                "email" : [ "allie@example.net" ],
                "first_name" : [ "Allie" ],
                "last_name" : [ "Jones" ],
                "phone" : [ "202-555-1234" ],
                "state" : [ "DC" ],
                "street" : [ "123 Main St" ]
              }
            }, {
              "_index" : "zentity_tutorial_5_cross_index_resolution_b",
              "_id" : "4",
              "_hop" : 0,
              "_query" : 1,
              "_attributes" : {
                "city" : [ "" ],
                "email" : [ "" ],
                "first_name" : [ "Ally" ],
                "last_name" : [ "Joans" ],
                "phone" : [ "202-555-1234" ],
                "state" : [ "" ],
                "street" : [ "" ]
              }
            }, {
              "_index" : "zentity_tutorial_5_cross_index_resolution_b",
              "_id" : "6",
              "_hop" : 1,
              "_query" : 1,
              "_attributes" : {
                "city" : [ "Washington" ],
                "email" : [ "allie@example.net" ],
                "first_name" : [ "Allison" ],
                "last_name" : [ "Jones" ],
                "phone" : [ "202-555-1234" ],
                "state" : [ "DC" ],
                "street" : [ "123 Main St" ]
              }
            }, {
              "_index" : "zentity_tutorial_5_cross_index_resolution_a",
              "_id" : "11",
              "_hop" : 2,
              "_query" : 0,
              "_attributes" : {
                "city" : [ "" ],
                "email" : [ "allie@example.net" ],
                "first_name" : [ "Alison" ],
                "last_name" : [ "Jones-Smith" ],
                "phone" : [ "2025559867" ],
                "state" : [ "" ],
                "street" : [ "" ]
              }
            }, {
              "_index" : "zentity_tutorial_5_cross_index_resolution_a",
              "_id" : "7",
              "_hop" : 3,
              "_query" : 0,
              "_attributes" : {
                "city" : [ "Washington" ],
                "email" : [ "" ],
                "first_name" : [ "Allison" ],
                "last_name" : [ "Smith" ],
                "phone" : [ "+1 (202) 555 1234" ],
                "state" : [ "DC" ],
                "street" : [ "555 Broad St" ]
              }
            }, {
              "_index" : "zentity_tutorial_5_cross_index_resolution_b",
              "_id" : "10",
              "_hop" : 3,
              "_query" : 1,
              "_attributes" : {
                "city" : [ "Washington" ],
                "email" : [ "" ],
                "first_name" : [ "Alison" ],
                "last_name" : [ "Smith" ],
                "phone" : [ "202-555-9876" ],
                "state" : [ "DC" ],
                "street" : [ "555 Broad St" ]
              }
            } ]
          }
        };


        insomnia.test('Check if status is 200', () => {
          insomnia.expect(insomnia.response.code).to.eql(200);
        });


        const response = insomnia.response.json();


        insomnia.test('Response has correct top-level structure', () => {
          insomnia.expect(response).to.have.property('took');
          insomnia.expect(response).to.have.property('hits');
        });


        insomnia.test('Took value exists and is a number', () => {
          insomnia.expect(response.took).to.be.a('number');
        });


        insomnia.test('Hits structure shows partial result set', () => {
          insomnia.expect(response.hits.total).to.eql(6);
          insomnia.expect(response.hits.hits).to.have.lengthOf(6);
        });


        insomnia.test('Hit objects have required properties', () => {
          response.hits.hits.forEach(hit => {
            insomnia.expect(hit).to.have.all.keys('_index', '_id', '_hop', '_query', '_attributes');
          });
        });


        insomnia.test('Cross-index resolution uses both indices', () => {
          const indices = new Set(response.hits.hits.map(hit => hit._index));
          insomnia.expect(indices.size).to.eql(2);
          insomnia.expect(indices.has('zentity_tutorial_5_cross_index_resolution_a')).to.be.true;
          insomnia.expect(indices.has('zentity_tutorial_5_cross_index_resolution_b')).to.be.true;
        });


        insomnia.test('Query values correctly distinguish indices', () => {
          const indexAHits = response.hits.hits.filter(hit => hit._index.includes('_a'));
          const indexBHits = response.hits.hits.filter(hit => hit._index.includes('_b'));
          
          indexAHits.forEach(hit => {
            insomnia.expect(hit._query).to.eql(0);
          });
          
          indexBHits.forEach(hit => {
            insomnia.expect(hit._query).to.eql(1);
          });
        });


        insomnia.test('Hop progression shows truncated resolution', () => {
          const expectedHops = [0, 0, 1, 2, 3, 3];
          response.hits.hits.forEach((hit, index) => {
            insomnia.expect(hit._hop).to.eql(expectedHops[index]);
          });
        });


        insomnia.test('Resolution stops at hop 3', () => {
          const maxHop = Math.max(...response.hits.hits.map(hit => hit._hop));
          insomnia.expect(maxHop).to.eql(3);
        });


        insomnia.test('Hit IDs are correct', () => {
          const expectedIds = ['1', '4', '6', '11', '7', '10'];
          response.hits.hits.forEach((hit, index) => {
            insomnia.expect(hit._id).to.eql(expectedIds[index]);
          });
        });


        insomnia.test('All hits have complete attribute structure', () => {
          response.hits.hits.forEach(hit => {
            insomnia.expect(hit._attributes).to.have.all.keys('city', 'email', 'first_name', 'last_name', 'phone', 'state', 'street');
          });
        });


        insomnia.test('Initial hop 0 hits from different indices', () => {
          const hop0Hits = response.hits.hits.filter(hit => hit._hop === 0);
          insomnia.expect(hop0Hits).to.have.lengthOf(2);
          insomnia.expect(hop0Hits[0]._index).to.include('_a');
          insomnia.expect(hop0Hits[1]._index).to.include('_b');
        });


        insomnia.test('Shared phone number at hop 0', () => {
          const hop0Hits = response.hits.hits.filter(hit => hit._hop === 0);
          insomnia.expect(hop0Hits[0]._attributes.phone[0]).to.eql('202-555-1234');
          insomnia.expect(hop0Hits[1]._attributes.phone[0]).to.eql('202-555-1234');
        });


        insomnia.test('Name variations show progression', () => {
          const firstNames = response.hits.hits.map(hit => hit._attributes.first_name[0]);
          const lastNames = response.hits.hits.map(hit => hit._attributes.last_name[0]);
          
          insomnia.expect(firstNames).to.include('Allie');
          insomnia.expect(firstNames).to.include('Ally');
          insomnia.expect(firstNames).to.include('Allison');
          insomnia.expect(firstNames).to.include('Alison');
          
          insomnia.expect(lastNames).to.include('Jones');
          insomnia.expect(lastNames).to.include('Joans');
          insomnia.expect(lastNames).to.include('Jones-Smith');
          insomnia.expect(lastNames).to.include('Smith');
        });


        insomnia.test('Phone format variations across hops', () => {
          const phoneNumbers = response.hits.hits.map(hit => hit._attributes.phone[0]).filter(phone => phone !== '');
          insomnia.expect(phoneNumbers).to.include('202-555-1234');
          insomnia.expect(phoneNumbers).to.include('2025559867');
          insomnia.expect(phoneNumbers).to.include('+1 (202) 555 1234');
          insomnia.expect(phoneNumbers).to.include('202-555-9876');
        });


        insomnia.test('Email progression shows entity continuity', () => {
          const emails = response.hits.hits.map(hit => hit._attributes.email[0]).filter(email => email !== '');
          insomnia.expect(emails).to.include('allie@example.net');
          
          // Email appears in multiple hits showing continuity
          const emailHits = response.hits.hits.filter(hit => hit._attributes.email[0] === 'allie@example.net');
          insomnia.expect(emailHits.length).to.be.above(1);
        });


        insomnia.test('Geographic data shows Washington DC focus', () => {
          const cities = response.hits.hits.map(hit => hit._attributes.city[0]).filter(city => city !== '');
          const states = response.hits.hits.map(hit => hit._attributes.state[0]).filter(state => state !== '');
          
          cities.forEach(city => {
            insomnia.expect(city).to.eql('Washington');
          });
          
          states.forEach(state => {
            insomnia.expect(state).to.eql('DC');
          });
        });


        insomnia.test('Street addresses show progression', () => {
          const streets = response.hits.hits.map(hit => hit._attributes.street[0]).filter(street => street !== '');
          insomnia.expect(streets).to.include('123 Main St');
          insomnia.expect(streets).to.include('555 Broad St');
        });


        insomnia.test('Hop 3 has hits from both indices', () => {
          const hop3Hits = response.hits.hits.filter(hit => hit._hop === 3);
          insomnia.expect(hop3Hits).to.have.lengthOf(2);
          
          const indices = hop3Hits.map(hit => hit._index);
          insomnia.expect(indices).to.include('zentity_tutorial_5_cross_index_resolution_a');
          insomnia.expect(indices).to.include('zentity_tutorial_5_cross_index_resolution_b');
        });


        insomnia.test('Index distribution is balanced', () => {
          const indexACounts = response.hits.hits.filter(hit => hit._index.includes('_a')).length;
          const indexBCounts = response.hits.hits.filter(hit => hit._index.includes('_b')).length;
          
          insomnia.expect(indexACounts).to.eql(3);
          insomnia.expect(indexBCounts).to.eql(3);
        });


        insomnia.test('Last name evolution shows entity resolution chain', () =>
        {
          const lastNameProgression = response.hits.hits.map(hit => hit._attributes.last_name[0]);
          
          // Should show progression from Jones/Joans -> Jones-Smith -> Smith
          insomnia.expect(lastNameProgression[0]).to.eql('Jones');    // hop 0, index A
          insomnia.expect(lastNameProgression[1]).to.eql('Joans');    // hop 0, index B
          insomnia.expect(lastNameProgression[2]).to.eql('Jones');    // hop 1, index B
          insomnia.expect(lastNameProgression[3]).to.eql('Jones-Smith'); // hop 2, index A
          insomnia.expect(lastNameProgression[4]).to.eql('Smith');    // hop 3, index A
          insomnia.expect(lastNameProgression[5]).to.eql('Smith');    // hop 3, index B
        });


        insomnia.test('Contact information completeness varies by hit', () => {
          // Some hits have complete contact info, others don't
          const contactCompleteHits = response.hits.hits.filter(hit => 
            hit._attributes.email[0] !== '' && hit._attributes.phone[0] !== ''
          );
          const contactIncompleteHits = response.hits.hits.filter(hit => 
            hit._attributes.email[0] === '' || hit._attributes.phone[0] === ''
          );
          
          insomnia.expect(contactCompleteHits.length).to.be.above(0);
          insomnia.expect(contactIncompleteHits.length).to.be.above(0);
        });


        insomnia.test('Truncated at intermediate hop level', () => {
          // This response stops at hop 3, suggesting it might be limited or scoped
          const finalHop = Math.max(...response.hits.hits.map(hit => hit._hop));
          insomnia.expect(finalHop).to.be.below(5); // Less than the full 9-hit response
          insomnia.expect(response.hits.total).to.be.below(9); // Fewer total hits
        });
    settings:
      renderRequestBody: true
      encodeUrl: true
      followRedirects: global
      cookies:
        send: true
