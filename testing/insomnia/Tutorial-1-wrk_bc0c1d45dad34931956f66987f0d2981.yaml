          insomnia.expect(insomnia.response.code).to.eql(200);
        });


        const response = insomnia.response.json();


        insomnia.test('Response has correct top-level structure', () => {
          insomnia.expect(response).to.have.property('took');
          insomnia.expect(response).to.have.property('hits');
        });


        // insomnia.test('Response took value is correct', () => {

        //   insomnia.expect(response.took).to.eql(4);

        // });


        insomnia.test('Hits structure is correct', () => {
          insomnia.expect(response.hits.total).to.eql(2);
          insomnia.expect(response.hits.hits).to.have.lengthOf(2);
        });


        insomnia.test('Hit objects have required properties including
        _explanation', () => {
          response.hits.hits.forEach(hit => {
            insomnia.expect(hit).to.have.all.keys('_index', '_id', '_hop', '_query', '_attributes', '_explanation', '_source');
          });
        });


        insomnia.test('Hit values are correct', () => {
          response.hits.hits.forEach(hit => {
            insomnia.expect(hit._index).to.eql('zentity_tutorial_1_exact_name_matching');
            insomnia.expect(hit._hop).to.eql(0);
            insomnia.expect(hit._query).to.eql(0);
            insomnia.expect(hit._attributes.first_name).to.eql(['Allie']);
            insomnia.expect(hit._attributes.last_name).to.eql(['Jones']);
          });
        });


        insomnia.test('Explanation structure is correct', () => {
          response.hits.hits.forEach(hit => {
            insomnia.expect(hit._explanation).to.have.property('resolvers');
            insomnia.expect(hit._explanation).to.have.property('matches');
            insomnia.expect(hit._explanation.resolvers).to.have.property('name_only');
            insomnia.expect(hit._explanation.resolvers.name_only.attributes).to.eql(['first_name', 'last_name']);
            insomnia.expect(hit._explanation.matches).to.have.lengthOf(2);
          });
        });


        insomnia.test('Match objects have correct structure and values', () => {
          response.hits.hits.forEach(hit => {
            hit._explanation.matches.forEach(match => {
              insomnia.expect(match).to.have.all.keys('attribute', 'target_field', 'target_value', 'input_value', 'input_matcher', 'input_matcher_params');
              insomnia.expect(match.input_matcher).to.eql('simple');
              insomnia.expect(match.input_matcher_params).to.be.an('object');
            });
            
            // Check first_name match
            const firstNameMatch = hit._explanation.matches.find(m => m.attribute === 'first_name');
            insomnia.expect(firstNameMatch.target_field).to.eql('first_name');
            insomnia.expect(firstNameMatch.target_value).to.eql('Allie');
            insomnia.expect(firstNameMatch.input_value).to.eql('Allie');
            
            // Check last_name match
            const lastNameMatch = hit._explanation.matches.find(m => m.attribute === 'last_name');
            insomnia.expect(lastNameMatch.target_field).to.eql('last_name');
            insomnia.expect(lastNameMatch.target_value).to.eql('Jones');
            insomnia.expect(lastNameMatch.input_value).to.eql('Jones');
          });
        });


        insomnia.test('First hit source data is correct', () => {
          const firstHit = response.hits.hits[0];
